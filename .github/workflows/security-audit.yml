# =============================================================================
# Auditoría semanal de dependencias — SCRUM-962 (épica SCRUM-959)
#
# Detecta advisories NUEVOS entre pushes (dev/test no corren CI por ADR-009). Cuesta ~1 min/semana:
# solo lee composer.lock, no instala nada. Termina en ROJO únicamente si hay advisories de severidad
# alta o crítica (`infra/audit.sh --strict`), para que llegue el aviso de GitHub; el resto es reporte
# en el resumen del run. Ejecución manual: Actions → "Auditoría semanal de dependencias" → Run workflow.
# =============================================================================
name: Auditoría semanal de dependencias

on:
  schedule:
    - cron: '0 13 * * 1'   # lunes 13:00 UTC (08:00 Panamá)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: composer audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: composer audit (rojo solo si hay alta o crítica)
        run: infra/audit.sh --strict
