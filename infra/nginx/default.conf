server {
    listen 80;
    server_name _;

    client_max_body_size 520M;

    # Epic 11 — Seguridad Agéntica: copia del access log como archivo real para CrowdSec.
    access_log /var/log/nginx-crowdsec/access.log main;

    # Epic 11 — Seguridad Agéntica (ADR-005): ModSecurity + OWASP CRS. Arranca en
    # DetectionOnly (default de modsecurity.conf del paquete) — no bloquea tráfico todavía.
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec-main.conf;

    # React estático (build de atlanticerp-frontend), montado en /var/www/frontend
    root /var/www/frontend;
    index index.html;

    # API Laravel — pasa directamente a PHP-FPM sin try_files para no romper POST
    location /api/ {
        include fastcgi_params;
        fastcgi_pass laravel:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Health check Laravel
    location = /up {
        include fastcgi_params;
        fastcgi_pass laravel:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Horizon dashboard
    location /horizon {
        include fastcgi_params;
        fastcgi_pass laravel:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Share links (SCRUM) — endpoint público sin autenticación, sin prefijo /api,
    # tiene que llegar a Laravel y no caer en el catch-all de la SPA de más abajo.
    location /public/ {
        include fastcgi_params;
        fastcgi_pass laravel:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Assets con hash (JS/CSS) — cache permanente en el cliente
    location ~* \.(?:js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html — nunca cachear, fuerza al browser a buscar el bundle más reciente
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # version.json — nunca cachear; usado por useDevLiveReload para detectar nuevos deploys
    location = /version.json {
        add_header Cache-Control "no-store";
        add_header Pragma "no-cache";
        expires 0;
    }

    # SPA React — todas las rutas del frontend van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
