# El nginx.conf de Debian no trae un log_format "main" con nombre (a diferencia del que traía
# nginx:alpine) — nuestros server blocks lo referencian por nombre para el log que lee CrowdSec.
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" "$http_x_forwarded_for"';
