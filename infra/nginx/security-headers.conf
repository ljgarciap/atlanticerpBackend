# SCRUM-1032 (A-07) — cabeceras de seguridad HTTP. Fragmento único, versionado, copiado a la imagen
# (Dockerfile) y reutilizado por los tres servidores. `add_header` de un `location` ANULA los del
# `server`, por eso este include se repite en cada location que declara su propio add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP solo Report-Only en esta fase: no bloquea nada. Pasar a bloqueante tras ≥1 semana sin
# violaciones atribuibles a la app. 'unsafe-inline' en estilos por los style={{…}} de React.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.amazonaws.com; font-src 'self' data:; connect-src 'self' https://*.amazonaws.com; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
