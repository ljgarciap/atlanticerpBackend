# CAP-02 (informe 2, spec docs/specs/rechazo-rapido-saturacion.md) — rechazo rápido ante saturación.
# Zonas de conteo de peticiones simultáneas hacia PHP. Los límites numéricos viven en los fragmentos
# load-shedding*.conf (un solo lugar para ajustarlos). Pasado el límite nginx responde 503 al instante
# (location @busy de cada servidor) en vez de encolar hasta ~30 s y dejar caer todo el servicio.
limit_conn_zone $server_name zone=api_conc:64k;
limit_conn_zone $server_name zone=login_conc:64k;
limit_conn_status 503;
limit_conn_log_level warn;
