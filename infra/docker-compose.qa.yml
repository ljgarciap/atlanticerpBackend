# Docker Compose — entorno QA (EC2 dedicado: crm-illumination-qa)
#
# Basado en infra/docker-compose.yml (entorno local de desarrollo). Mismos
# nombres de servicio para mantener consistencia entre entornos.
#
# Diferencias respecto al compose local:
#   - Sin bind-mount del código fuente completo: en QA/Prod el repo ya está
#     clonado en el host EC2 (/var/www/backend, ver docs/aws-ec2-setup-walkthrough.md)
#     y la imagen de "laravel"/"horizon" se construye desde ese checkout —
#     patrón "despliegue por clonado de repo + build en el host EC2".
#     Solo se monta el código como volumen de solo lectura (no ro completo del
#     repo de desarrollo), para evitar reconstruir la imagen ante cada cambio
#     de dependencias sin perder la posibilidad de desplegar con `git pull` +
#     `docker compose up -d --build`.
#   - restart: unless-stopped en todos los servicios.
#   - nginx publica el puerto 80 estándar (no hay otros proyectos compartiendo
#     el Docker daemon en el EC2 de QA, a diferencia del Mac de desarrollo).
#   - El build de atlanticerp-frontend se coloca de forma fija en el host EC2 en
#     /var/www/static (ver Paso 12 del walkthrough) y se monta ahí — no se
#     depende de un repo hermano "../../atlanticerp-frontend/dist" en disco.
#   - postgres/redis siguen sin publicar puertos al host: solo acceso desde
#     la red interna del compose (no se necesita acceso externo directo).
#
# ⚠️  AISLAMIENTO (agregado 2026-08-30, tras un incidente real en local — ver
#     Atlantic/CLAUDE.md): este EC2 debe ser EXCLUSIVO de AtlanticERP, nunca
#     compartido con el de binax. `/data/postgres/pgdata`, `/var/www/static`
#     y `/etc/letsencrypt` son rutas ABSOLUTAS del host — si este compose
#     alguna vez corre en el mismo host/Docker daemon que el de binax
#     (mismas rutas), los dos postgres escribirían sobre el mismo directorio
#     real en disco. `name: atlanticerp-qa` (abajo) separa contenedores/red,
#     pero NO separa estas rutas de host — verificar que el EC2 destino sea
#     nuevo y dedicado antes de desplegar.

# Fase 0 — propuesta de logs/backups aprobada 2026-08-20 (ver atlanticerp/CLAUDE.md § Infraestructura
# AWS, memory/project_propuesta_logs_backups_aprobada_20260820.md): límite de tamaño de logs por
# contenedor, para eliminar el riesgo de disco lleno por acumulación (driver json-file de Docker
# no tiene límite por defecto).
name: atlanticerp-qa

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # SCRUM-1073 (HA F2): archivado continuo de WAL. Cada segmento terminado (o cada 5 min si hubo actividad) se
    # comprime en /wal-archive (= /data/wal-archive del host, creada por infra/scripts/setup-wal-archiving.sh ANTES de
    # desplegar esto); ship-wal.sh los sube a S3. Permite restaurar a un instante (RPO de minutos).
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=test ! -f /wal-archive/%f.gz && gzip -c %p > /wal-archive/%f.gz.tmp && mv /wal-archive/%f.gz.tmp /wal-archive/%f.gz
    volumes:
      - /data/postgres/pgdata:/var/lib/postgresql/data
      - /data/wal-archive:/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SCRUM-563 (2026-09-15, expuesto por IP 2026-09-16 a pedido de Luis) — captura de correo
  # saliente para verificar features de email sin depender de un buzón real ni de
  # storage/logs/laravel.log. Mailpit (sucesor activo de MailHog, que quedó sin mantenimiento
  # upstream): SMTP falso en el puerto 1025, solo alcanzable desde otros contenedores de este
  # compose por nombre de servicio (`mailpit`, sin publicar puerto al host) + UI web en 8025.
  # Puerto 8025 publicado en 0.0.0.0 (acceso directo por IP:8025, sin dominio/SSL/nginx, mismo
  # patrón que usaba MailHog) — la protección real es `MP_UI_AUTH` (usuario/clave nativo de
  # Mailpit, valor real solo en el `.env` del servidor, nunca en este archivo versionado):
  # captura correos reales de features como MFA/reset de password, así que la UI nunca queda sin
  # auth. Security Group (`sg-058c00000f9c0e23b`, compartido con `atlanticerp-prod`) tiene 8025 abierto
  # a 0.0.0.0/0 — decisión explícita de Luis, la protección vive en la app, no en la red.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_UI_AUTH: ${MAILPIT_UI_AUTH}

  laravel:
    build:
      context: ./php
    restart: unless-stopped
    logging: *default-logging
    working_dir: /var/www/html
    command: php-fpm
    env_file:
      - ../.env
    volumes:
      - ../:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  horizon:
    build:
      context: ./php
    restart: unless-stopped
    logging: *default-logging
    working_dir: /var/www/html
    command: php artisan horizon
    env_file:
      - ../.env
    volumes:
      - ../:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan --version > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  # SCRUM-838/839 (2026-09-14) — hallazgo real: el Scheduler de Laravel (routes/console.php)
  # nunca tuvo nada que lo dispare en ningún ambiente — sin crontab del SO, sin systemd timer, sin
  # contenedor dedicado (confirmado: `laravel` solo corre php-fpm, `horizon` solo corre
  # `php artisan horizon`, ninguno invoca schedule:run). Esto afecta a TODO Schedule:: ya
  # registrado, no solo a legacy:sync-incremental-* — security:analyze, audit-logs:archive,
  # commissions:settle-internal y las notificaciones tampoco corrieron nunca automáticamente.
  #
  # Contenedor dedicado (no un cron del SO) a propósito: los ambientes se clonan desde la AMI
  # `atlanticerp-base` — un cron del host se pierde/hay que recordarlo a mano en cada clon nuevo; este
  # servicio, versionado en docker-compose.qa.yml, se levanta solo con `docker compose up -d
  # --build`, igual que `horizon`. Costo medido en vivo en dev.atlanticerp.ai (2026-09-14): ~126ms de
  # CPU por chequeo (`time php artisan schedule:run` sin nada debido), ~0.2% de CPU promedio
  # corriendo cada 60s.
  #
  # NOTA 2026-09-15: el diseño original de SCRUM-838 escalonaba las 9 entidades por minuto
  # (:05/:07/:15/.../:32), que motivaba correr este loop cada 60s para no perder ningún offset —
  # reemplazado por `legacy:sync-incremental-all` (una sola entrada de Schedule::, ver
  # routes/console.php), pero el intervalo de 60s se mantiene igual: sigue siendo el más ajustado
  # a la granularidad real de cron (por minuto) sin agregar complejidad, y el costo medido arriba
  # sigue siendo despreciable.
  scheduler:
    build:
      context: ./php
    restart: unless-stopped
    logging: *default-logging
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    env_file:
      - ../.env
    volumes:
      - ../:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    # Startup delegado a entrypoint.sh (montado abajo) para evitar que
    # docker-compose interpole variables de shell del script.
    command: ["/entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    volumes:
      - ./nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./nginx/default-ssl.conf.template:/etc/nginx/conf.d/ssl.conf.template:ro
      - ./nginx/default-http.conf.template:/etc/nginx/conf.d/http.conf.template:ro
      - ../:/var/www/html:ro
      - /var/www/static:/var/www/frontend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Epic 11 — Seguridad Agéntica: copia del access log como archivo real en el host,
      # para que CrowdSec (corre nativo en el host, no en Docker) pueda leerlo. access.log
      # sigue yendo a stdout también (docker logs), esto es un log_format adicional.
      - /var/log/nginx-crowdsec:/var/log/nginx-crowdsec
    depends_on:
      - laravel
