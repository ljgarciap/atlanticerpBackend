; CAP-02 — php-fpm con valores explícitos (antes: los de la imagen, sin documentar).
; pm.max_children = 5 se mantiene a propósito: el límite medido es la CPU (2 vCPU), más procesos no suman capacidad
; y con memory_limit=256M ocupar más de ~1,25 GB pondría en riesgo los 2 GB de la instancia.
[www]
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; recicla procesos para evitar crecimiento de memoria con el tiempo
pm.max_requests = 500
; un proceso colgado no debe retener un cupo para siempre (las rutas lentas legítimas son < 60 s; margen amplio)
request_terminate_timeout = 180s
