upload_max_filesize = 520M
post_max_size       = 520M

; memory_limit (agregado 2026-08-30) — el default de PHP (128M) no alcanza para la suite
; completa de PHPUnit local (exports XLSX vía phpoffice/phpspreadsheet + zipstream-php
; agotan el límite y tumban el proceso). CI (.github/workflows/ci-backend.yml, shivammathur/
; setup-php) ya usa 512M — esto solo alinea el contenedor local con lo que CI prueba.
memory_limit = 512M
