; SCRUM-973 (Pre-QA, épica SCRUM-969) — hallazgo real: memory_limit=128M (default de PHP-FPM sin
; override) hace que una request con eager loading pesado (ej. WarehouseController::show() sobre
; Bodega Zona Libre, ~25,800 filas) muera con "Allowed memory size exhausted" SIN pasar por el
; exception handler de Laravel — no queda nada en laravel.log, la respuesta es un 500 opaco.
; 256M da margen razonable sin ser excesivo — no reemplaza paginar en SQL (ya hecho para el caso
; sin `search`), es la red de seguridad para picos puntuales (ej. fuzzy search sin filtro sobre un
; catálogo grande).
memory_limit = 256M
